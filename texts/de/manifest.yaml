sections:
  vision:
    label: Unsere Vision
    title: Medizinische Fähigkeiten für alle Menschen erreichbar machen.
    mission_title: Mission
    paragraphs:
      - 'Wir vereinfachen die Entwicklung medizinischer Technologie radikal: durch ein offenes Ökosystem unabhängig entwickelter, wiederverwendbarer und rekombinierbarer Fähigkeiten statt vertikal integrierter Produkte.'
  situation:
    label: 01 / Ausgangslage
    title: Der technologische Umbruch.
    paragraphs:
      - In den vergangenen zwanzig Jahren hat die digitale Revolution Technologie radikal verbessert, verbilligt und verfügbar gemacht. Smartphones ersetzten zahlreiche zuvor eigenständige Geräte und veränderten unsere Handlungen, Rollen und Prozesse.
      - 'Sie haben auch die Entwicklung von Technologie demokratisiert: Hunderttausende Menschen weltweit konnten eigene Anwendungen schaffen, ohne Hardware oder Betriebssysteme zu entwickeln. Damit wurde weltweit verteiltes Wissen mobilisiert, über das kein einzelnes Unternehmen verfügte.'
      - highlight: Ein vergleichbarer Umbruch steht in der Medizin weitgehend noch aus.
      - Trotz enormer wissenschaftlicher Fortschritte bleiben viele medizinische Geräte teuer, hochspezialisiert und an aufwendige Institutionen gebunden. Kosten, Verfügbarkeit und Versorgungsprozesse wurden nicht in vergleichbarem Umfang transformiert.
  problem:
    label: 02 / Problem
    title: Die Grenzen des bestehenden Systems.
    paragraphs:
      - Die Medizintechnik orientiert sich an bestehenden Berufsrollen, Institutionen und Abläufen. Produkte verbessern etablierte Gerätekategorien, Software bildet vorhandene Prozesse ab.
      - highlight: Wir entwickeln immer bessere Maschinen für weitgehend unveränderte Prozesse.
      - Dabei unterscheiden sich medizinische Aufgaben weltweit nach Personal, Infrastruktur, Ressourcen und gesellschaftlichen Bedingungen. Das nötige Wissen liegt bei Menschen, die unter diesen vielfältigen Bedingungen handeln – kein zentraler Entwicklungsprozess kann es vollständig erfassen.
      - Doch traditionelle Softwareprodukte sind vertikal integrierte Prozessketten für einzelne Anwendungsfälle. Wer eine einzelne neue Fähigkeit entwickeln oder erforschen will, muss oft eine vollständige Anwendung schaffen. Viele Ideen werden deshalb nicht untersucht, vorhandene Lösungen immer wieder neu gebaut.
      - highlight: Die Architektur unserer Produkte begrenzt, wer innovieren kann und welche Ideen wissenschaftlich untersucht werden.
  loesung:
    label: 03 / Lösung
    title: Unabhängige Fähigkeiten statt fester Prozessketten.
    paragraphs:
      - Wir denken Medizintechnik von der medizinischen Aufgabe her neu – nicht von bestehenden Produkten und Rollen. Die Grundeinheit unserer Architektur ist das wiederverwendbare Modul, nicht das vollständige Produkt.
      - Forschende können einzelne Komponenten untersuchen, statt ganze Versuchsumgebungen aufzubauen. Entwicklungsarbeiten aus einem Kontext lassen sich in vielen anderen verwenden.
      - highlight: Was die Smartphone-Revolution für vollständige Anwendungen ermöglichte, wollen wir für einzelne medizinische Fähigkeiten erreichen.
      - So mobilisieren wir weltweit verteiltes Wissen, senken technische Eintrittsbarrieren und wollen die Kosten zusätzlicher wissenschaftlicher Experimente um Größenordnungen reduzieren.
  prinzipien:
    label: Unser technisches und organisatorisches Fundament
    title: Zehn Prinzipien.
    principles:
      - title: Wiederverwendbarkeit von Anfang an
        text: Software wird von Beginn an für viele Anwendungen entwickelt, nicht für ein einzelnes Projekt. Wiederverwendbarkeit ist unser primäres architektonisches Qualitätsmerkmal.
      - title: Radikale Modularität
        text: Software besteht aus kleinen, fachlich zusammenhängenden, unabhängig austauschbaren Komponenten. Sensoranbindung, Datenverarbeitung, medizinische Interpretation und Benutzerführung werden getrennt.
      - title: KI-gestützte Softwareentwicklung
        text: Maschinenlesbare Modelle, explizite Schnittstellen und automatisierte Prüfungen ermöglichen es KI-Agenten, Module zu entwickeln, zu kombinieren und zu testen – auch für Menschen ohne umfassende Programmierkenntnisse.
      - title: Interoperabilität von Anfang an
        text: Jede Komponente beschreibt Fähigkeiten, Ein- und Ausgaben, Schnittstellen, Kommunikation, Abhängigkeiten und Einsatzgrenzen syntaktisch und semantisch. Kompatibilität wird überprüfbar statt nachträglich hergestellt.
      - title: Gemeinsame Ontologien
        text: Austauschbarkeit braucht gemeinsame Bedeutungen. Offene, versionierte Ontologien und Konformitätsprofile ermöglichen unabhängige Entwicklung. Geeignete bestehende Standards werden bevorzugt genutzt.
      - title: Offener Komponentenbestand
        text: Neue Module werden mit Beschreibungen, Abhängigkeiten und Tests veröffentlicht. Andere kombinieren sie zu reproduzierbaren Anwendungen. Der Schwerpunkt liegt auf von Anfang an wiederverwendbar entwickelter Software.
      - title: Radikale Offenheit
        text: Code, Ontologien, Schnittstellen und Werkzeuge müssen unabhängig nutzbar, veränderbar und kombinierbar sein – auch kommerziell. Offenheit ist Voraussetzung globaler Wiederverwendung.
      - title: Freedom to Fork
        text: Wer Zeit, Geld und Wissen investiert, benötigt Planungssicherheit. Jeder kann die gemeinsamen technischen Grundlagen kopieren und unabhängig fortführen. Die glaubwürdige Möglichkeit eines Forks kontrolliert die Governance und schützt vor Vereinnahmung.
      - title: Konsumelektronik und Skaleneffekte
        text: Wo möglich, verwenden wir massenhaft produzierte Standardhardware. Unverzichtbare Spezialhardware wird für einfache Herstellung, offene Schnittstellen und niedrige Kosten gestaltet.
      - title: Nahtlose Integration menschlicher Expertise
        text: Der Mensch ist Teil der Architektur. Medizinische Fähigkeiten entstehen aus dem Zusammenspiel von Software, KI, Sensoren und Fachleuten – vor Ort oder über Telemedizin in gemeinsamen Untersuchungs- und Entscheidungsprozessen.
  bewegung:
    label: Gemeinsam, aber unabhängig
    title: Eine globale Bewegung.
    paragraphs:
      - Die Zukunft medizinischer Technologie hängt weder an einem Institut noch an einem Produkt. Das Wissen ist weltweit verteilt. Auch seine technische Nutzung muss dezentral möglich sein.
      - Gemeinsame Ontologien, Schnittstellen und Werkzeuge verbinden die Beiträge unabhängiger Menschen und Institutionen. Eine globale Zentrale oder ein exklusiver Betreiber sind nicht erforderlich.
      - Unsere Ambition umfasst Prävention, Diagnostik, Behandlung und Pflege. Wir messen den Erfolg an Kosten und Zeit pro validem Experiment, an der Verfügbarkeit medizinischer Fähigkeiten und am tatsächlichen Gesundheitsnutzen.
      - highlight: Wir wollen nicht nur bessere Medizintechnik entwickeln. Wir wollen weltweit mehr Menschen befähigen, bessere Medizintechnik zu entwickeln.
    button: Der Bewegung anschließen
