sections:
  - title: 2. Zugriff auf die Website
    text: Die Website ist technisch als statisches Angebot gestaltet und benötigt keine Benutzerkonten, eingebetteten externen Schriften, Analyse-Skripte oder Drittanbieter-Trackingtools. Beim Abruf können durch den jeweiligen Webhosting-Anbieter technisch erforderliche Verbindungsdaten und Serverprotokolle verarbeitet werden, beispielsweise IP-Adresse, Datum und Uhrzeit sowie angeforderte Dateien. Einzelheiten, Rechtsgrundlagen und Speicherfristen sind nach Festlegung des Hosters hier zu ergänzen.
  - title: 3. Kontaktaufnahme per E-Mail
    text: Wenn Sie uns eine E-Mail schreiben, verarbeiten wir Ihre Angaben, um Ihre Anfrage zu beantworten und gegebenenfalls eine Zusammenarbeit zu besprechen. Der konkrete Zweck und die Rechtsgrundlage richten sich nach Inhalt und Kontext der Anfrage. Bitte übermitteln Sie keine unnötigen sensiblen Gesundheitsdaten.
  - title: 4. Cookies und externe Dienste
    text: Der gelieferte Website-Code verwendet keine Tracking-Cookies, keine externen eingebetteten Inhalte und keine Webanalyse. Änderungen durch spätere Hosting- oder Drittanbieterfunktionen sind bei Veröffentlichung erneut zu prüfen.
  - title: 5. Betroffenenrechte
    text: Im Rahmen der gesetzlichen Voraussetzungen können Sie insbesondere Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung, Widerspruch und gegebenenfalls Datenübertragbarkeit verlangen. Sie haben das Recht, sich bei einer zuständigen Datenschutzaufsichtsbehörde zu beschweren.
  - title: 6. Änderungen
    text: Diese Informationen sind bei Änderungen des Website-Betriebs und der eingesetzten Dienste zu aktualisieren.

