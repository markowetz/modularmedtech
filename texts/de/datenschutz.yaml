sections:
  - title: 2. Zugriff auf die Website
    text: Die Website ist ein statisches Angebot ohne Benutzerkonten, eingebettete externe Schriften, Analyse-Skripte oder Tracking-Tools von Drittanbietern. Sie wird über GitHub Pages (GitHub, Inc., San Francisco, USA) gehostet. Beim Abruf verarbeitet GitHub technische Zugriffsdaten wie IP-Adresse, Datum und Uhrzeit, angeforderte Dateien und Browserangaben, um die Website auszuliefern und den sicheren Betrieb zu gewährleisten. Rechtsgrundlage ist unser berechtigtes Interesse an einer zuverlässigen Bereitstellung der Website (Art. 6 Abs. 1 lit. f DSGVO). Dabei können Daten in die USA übermittelt werden. Weitere Informationen enthält das <a href="https://docs.github.com/de/site-policy/privacy-policies/github-general-privacy-statement">GitHub Privacy Statement</a>.
  - title: 3. Kontaktaufnahme per E-Mail
    text: Wenn Sie uns eine E-Mail schreiben, verarbeiten wir Ihre Angaben, um Ihre Anfrage zu beantworten und gegebenenfalls eine Zusammenarbeit zu besprechen. Der konkrete Zweck und die Rechtsgrundlage richten sich nach Inhalt und Kontext der Anfrage. Bitte übermitteln Sie keine unnötigen sensiblen Gesundheitsdaten.
  - title: 4. Cookies und externe Dienste
    text: Diese Website setzt keine Cookies, bindet keine externen Inhalte ein und verwendet keine Webanalyse.
  - title: 5. Betroffenenrechte
    text: Im Rahmen der gesetzlichen Voraussetzungen können Sie insbesondere Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung, Widerspruch und gegebenenfalls Datenübertragbarkeit verlangen. Sie haben das Recht, sich bei einer zuständigen Datenschutzaufsichtsbehörde zu beschweren.
  - title: 6. Änderungen
    text: Diese Informationen sind bei Änderungen des Website-Betriebs und der eingesetzten Dienste zu aktualisieren.

