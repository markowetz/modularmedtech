# Seite „1,000 Villages“. Texte dürfen einfaches HTML enthalten: <br> (Zeilenumbruch), <em> (hervorgehoben).
meta:
  title: 1,000 Villages – One Device per Village | Modular MedTech
  description: "1.000 Geräte für 1.000 Dörfer im Globalen Süden: internationale Outreach- und Vernetzungsstrategie von Modular MedTech."

hero:
  label: Internationale Outreach-Initiative
  title: 1,000 Villages.<br><span class="hi">One Device per Village.</span>
  text: "Unser Ziel: 1.000 Diagnoseplattformen aus Tablet und Ultraschallsonde für 1.000 Dörfer im Globalen Süden."

goal:
  label: Ein konkretes Ziel für eine globale Bewegung
  number: "1,000"
  title: Geräte.<br>1.000 Dörfer.
  text: Ein Tablet, eine Ultraschallsonde und modulare Diagnostiksoftware. Die Initiative befindet sich im Aufbau – mit dem Ziel, Vernetzung, Felderfahrung und gemeinsame Entwicklung zu ermöglichen.

purpose:
  label: Worum es geht
  title: Nicht nur verteilen. <em>Verbinden.</em>
  intro: Das Gerät ist der konkrete Ausgangspunkt für Kontakte, praktische Erfahrung und eine internationale Forschungs- und Entwicklergemeinschaft.
  steps:
    - number: 01 / SICHTBAR MACHEN
      title: Kommunizieren
      text: Ein greifbares Ziel zeigt, wofür Modular MedTech steht und wen die Bewegung erreichen will.
    - number: 02 / VOR ORT SEIN
      title: Vernetzen
      text: Medizinische Einrichtungen, Forschende, Entwickler und lokale Initiativen zusammenbringen.
    - number: 03 / EINSATZ ERLEBEN
      title: Lernen
      text: Reale Nutzungserfahrungen, Rückmeldungen und bislang übersehene Anforderungen erschließen.
    - number: 04 / GEMEINSAM BAUEN
      title: Mitentwickeln
      text: Internationale Partner beteiligen sich als Entwickler eigenständiger Module und Anwendungen.

ambition:
  label: Unser Anspruch
  quote: Wir bringen nicht nur Technologie in die Welt. Wir wollen das Wissen der Welt für neue Technologie mobilisieren.

cocreation:
  label: Globale Ko-Kreation
  title: Lokale Partner sind nicht nur Anwender.
  paragraphs:
    - Sie kennen medizinische Bedürfnisse, Ressourcen und konkrete Abläufe aus eigener Erfahrung. Ihre Rückmeldungen sollen neue Forschungsfragen und Komponenten hervorbringen.
    - Die offene Architektur erlaubt es, dass lokal entwickelte Fähigkeiten später weltweit wiederverwendet werden.
  cards:
    - label: Für lokale Organisationen
      title: Eigene Anforderungen sichtbar machen
      text: Wir suchen Partner, die den praktischen Einsatz, Feedback und lokale Zusammenarbeit ermöglichen.
    - label: Für Forschung & Entwicklung
      title: Selbst zum Mitentwickler werden
      text: Internationale Teams können Module erweitern, eigene Ideen untersuchen und neue Anwendungen aufbauen.

callout:
  label: Eine Initiative im Aufbau
  title: Aus 1.000 Einsatzorten<br><span style="color:var(--lime)">wird ein Netzwerk.</span>
  text: Wir suchen Organisationen im Globalen Süden, Forschungsgruppen und Partner, die diese Initiative mitgestalten möchten.
  button: Partner werden
