notice:
  strong: "Review before publication:"
  text: This privacy notice is tailored to the static website created here. Once hosting is selected, information about the actual hosting provider, server logs and any service providers must be added and reviewed for legal compliance.

controller:
  title: 1. Data controller
  address:
    - The Gesamtschau Institute UG (haftungsbeschränkt)
    - Ippendorfer Allee 31
