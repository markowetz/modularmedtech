# "Get involved" page. Texts may contain simple HTML: <br> (line break), <em> (emphasis).
# "subject" is the subject line of the email opened by the contact link.
meta:
  title: Get involved | Modular MedTech
  description: "Join Modular MedTech: collaborate in research, engineering, medical practice, outreach or funding."

hero:
  label: Collaboration
  title: Many ways <span class="hi">to build together.</span>
  text: Modular MedTech thrives on independent knowledge and the willingness to share it. We welcome concrete ideas, capabilities and connections.

ways:
  label: Get involved
  title: Where would you like <em>to contribute?</em>
  intro: Choose the right entry point. Every inquiry goes directly to the initiative’s email address — no account or web form required.
  link: Get in touch
  items:
    - number: 01 / JOIN THE MOVEMENT
      title: Research & development
      text: We are looking for medical, engineering and computer-science research teams for our first demonstrator.
      subject: Modular MedTech – Research collaboration
    - number: 02 / JOIN THE MOVEMENT
      title: Local partners
      text: Institutions and initiatives that can share practical experience, local needs and contacts in their regions.
      subject: Modular MedTech – Local partnership
    - number: 03 / JOIN THE MOVEMENT
      title: International networks
      text: Organizations, universities and developer communities that can connect more teams with the open ecosystem.
      subject: Modular MedTech – International collaboration
    - number: 04 / JOIN THE MOVEMENT
      title: Funding & support
      text: Foundations, companies and public institutions interested in supporting research, open infrastructure or outreach.
      subject: Modular MedTech – Funding and partnership

contact:
  label: Direct contact
  title: A concrete idea<br>is the best place to start.
  text: Briefly describe the question, experience or technical capability you would like to contribute. We do not yet have a formal membership scheme or centralized admissions body.
  subject: Modular MedTech – Collaboration
