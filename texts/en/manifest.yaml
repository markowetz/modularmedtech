sections:
  vision:
    label: Our vision
    title: Medical capabilities within everyone’s reach.
    mission_title: Mission
    paragraphs:
      - 'We radically simplify the development of medical technology: replacing vertically integrated products with an open ecosystem of independently developed, reusable and recombinable capabilities.'
  situation:
    label: 01 / Situation
    title: The technological transformation.
    paragraphs:
      - Over the past twenty years, the digital revolution has made technology dramatically better, cheaper and more accessible. Smartphones replaced numerous once-separate devices and transformed what we do, the roles we play and the processes we follow.
      - 'They also democratized technology development: hundreds of thousands of people around the world could create applications without building their own hardware or operating systems. This mobilized distributed knowledge that no single company possessed.'
      - highlight: A comparable transformation has largely yet to reach medicine.
      - Despite extraordinary scientific progress, many medical devices remain expensive, highly specialized and tied to complex institutions. Costs, access and care processes have not been transformed to a comparable extent.
  problem:
    label: 02 / Challenge
    title: The limits of the existing system.
    paragraphs:
      - Medical technology is designed around established professional roles, institutions and workflows. Products improve familiar device categories; software reproduces existing processes.
      - highlight: We keep building better machines for largely unchanged processes.
      - Yet medical work differs around the world in staffing, infrastructure, resources and social conditions. The knowledge needed to address these needs lies with people working in those varied settings — no centralized development process can capture it all.
      - Traditional software products, however, are vertically integrated process chains for individual use cases. Anyone wishing to build or study one new capability often has to create an entire application. Many ideas therefore go untested, while existing solutions are rebuilt again and again.
      - highlight: The architecture of our products limits who can innovate and which ideas can be investigated scientifically.
  loesung:
    label: 03 / Solution
    title: Independent capabilities instead of fixed process chains.
    paragraphs:
      - We rethink medical technology from the medical task itself, not from existing products or roles. The fundamental unit of our architecture is the reusable module, not the complete product.
      - Researchers can investigate individual components instead of building entire experimental environments. Work created for one context can be reused in many others.
      - highlight: What the smartphone revolution made possible for complete applications, we want to make possible for individual medical capabilities.
      - In this way, we mobilize knowledge worldwide, lower technical barriers to entry and aim to reduce the cost of additional scientific experiments by orders of magnitude.
  prinzipien:
    label: Our technical and organizational foundations
    title: Ten principles.
    principles:
      - title: Reuse by Design
        text: Software is developed for many applications from the outset, not for a single project. Reusability is our primary architectural quality criterion.
      - title: Radical Modularity
        text: Software consists of small, cohesive and independently replaceable components. Sensor interfaces, data processing, medical interpretation and user experience remain separate.
      - title: AI-Assisted Software Development
        text: Machine-readable models, explicit interfaces and automated checks enable AI agents to develop, combine and test modules — empowering people without extensive programming expertise.
      - title: Interoperability by Construction
        text: Each component describes its capabilities, inputs and outputs, interfaces, communications, dependencies and operating constraints, both syntactically and semantically. Compatibility becomes testable rather than an afterthought.
      - title: Shared Ontologies
        text: Interchangeability requires shared meanings. Open, versioned ontologies and conformance profiles enable independent development. Existing standards are preferred where appropriate.
      - title: Open Component Store
        text: New modules are published with descriptions, dependencies and tests. Others combine them into reproducible applications. Our emphasis is on software designed for reuse from its first release.
      - title: Radical Openness
        text: Code, ontologies, interfaces and tools must be independently usable, modifiable and combinable — including commercially. Openness is a prerequisite for global reuse.
      - title: Freedom to Fork
        text: Those who invest time, money and knowledge need long-term certainty. Everyone can copy and independently continue developing the shared technical foundations. The credible possibility of a fork keeps governance accountable and protects against capture.
      - title: Consumer Electronics and Economies of Scale
        text: Where possible, we use mass-produced standard hardware. Essential specialized hardware is designed for simple manufacturing, open interfaces and low cost.
      - title: Seamless Integration of Human Expertise
        text: People are part of the architecture. Medical capabilities emerge from collaboration between software, AI, sensors and professionals — on site or via telemedicine, within shared examination and decision-making processes.
  bewegung:
    label: Together, yet independent
    title: A global movement.
    paragraphs:
      - The future of medical technology does not depend on one institution or product. Knowledge is distributed around the world, and its technical use must be decentralized as well.
      - Shared ontologies, interfaces and tools connect the work of independent people and institutions. No global headquarters or exclusive operator is required.
      - Our ambition encompasses prevention, diagnosis, treatment and care. We measure success by the cost and time per valid experiment, the accessibility of medical capabilities and demonstrated health benefits.
      - highlight: We do not merely want to build better medical technology. We want to empower more people around the world to build it.
    button: Join the movement
